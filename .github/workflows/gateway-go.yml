name: Go gateway

on:
  pull_request:
    paths:
      - "gateway-go/**"
      - ".github/workflows/gateway-go.yml"
  push:
    branches:
      - v2-reboot
    paths:
      - "gateway-go/**"
      - ".github/workflows/gateway-go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: gateway-go

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: gateway-go/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { echo "$files"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/syntropy-gateway
